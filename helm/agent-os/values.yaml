# Default values for graxia-tool.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: graxia-tool/api
  pullPolicy: IfNotPresent
  tag: "0.2.0"

# MCP SSE server (remote clients)
mcp:
  enabled: true
  replicaCount: 2
  image:
    repository: graxia-tool/mcp
    tag: "0.2.0"
  port: 8765

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api.graxia-tool.example.com
      paths:
        - path: /
          pathType: Prefix
    - host: mcp.graxia-tool.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: graxia-tool-tls
      hosts:
        - api.graxia-tool.example.com
        - mcp.graxia-tool.example.com

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

postgresql:
  enabled: true
  auth:
    database: agentos
    existingSecret: postgres-secrets
  primary:
    persistence:
      size: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi

redis:
  enabled: true
  master:
    persistence:
      size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

qdrant:
  enabled: true
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

env:
  logLevel: INFO
  logFormat: json
  enableMetrics: "true"
  workers: "4"

secrets:
  # Existing secrets to use
  databaseUrl: ""
  redisUrl: ""
  qdrantUrl: ""
  jwtSecret: ""
  llmApiKey: ""

livenessProbe:
  httpGet:
    path: /health/live
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health/ready
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
