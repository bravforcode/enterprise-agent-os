[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graxia_tool"
version = "0.2.0"
description = "Graxia Tool — Universal AI Agent OS with MCP server, cost engine, Obsidian + Graxia integration"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    # Redis
    "redis[hiredis]>=5.2.0",
    # Auth
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    # Logging
    "structlog>=24.4.0",
    # HTTP client
    "httpx>=0.28.0",
    # Config
    "python-dotenv>=1.0.1",
    # Token counting
    "tiktoken>=0.9.0",
    # Qdrant (vector DB)
    "qdrant-client>=1.12.0",
    "numpy>=1.26.0",
]

[project.scripts]
# Console scripts — install these with `pip install graxia-tool`
graxia = "graxia_tool.__main__:main"
graxia-mcp = "graxia_tool.__main__:main"
graxia-install = "graxia_tool.installer:install"

[project.entry-points.console_scripts]
graxia-web = "graxia_tool.__main__:main"

[project.optional-dependencies]
web = [
    # Web UI extras (FastAPI already in core deps)
    "jinja2>=3.1.0",
    "python-multipart>=0.0.18",
]
ollama = [
    # Ollama helper (httpx already in core deps)
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
ml = [
    # ONNX skill router (optional, falls back to keyword routing)
    "onnxruntime>=1.20.0",
    "tokenizers>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graxia_tool"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
